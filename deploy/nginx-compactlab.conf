# nginx vhosts for the playground and the API on the CompactLab VPS.
# Copy to /etc/nginx/sites-available/compactlab, link into sites-enabled,
# then run certbot (see docs/DEPLOY_VPS.md) to add HTTPS.

# Playground (Next.js, pm2 "compactlab-ide")
server {
    listen 80;
    listen [::]:80;
    server_name playground.compactlab.dev;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API (Hono, pm2 "compactlab-api")
server {
    listen 80;
    listen [::]:80;
    server_name api.compactlab.dev;

    # Compile requests carry up to 50 KB of source; project saves can be larger.
    client_max_body_size 5m;

    # The API rate-limits on the first X-Forwarded-For entry, so overwrite it
    # with the real client address instead of appending (clients could spoof it).

    # Indexer subscriptions (WebSocket). Keep them open long.
    location /v1/indexer/graphql/ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A synchronous full ZK compile can take several minutes.
        proxy_read_timeout 12m;
        proxy_send_timeout 12m;
    }
}
